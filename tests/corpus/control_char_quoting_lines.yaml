# The same quoting rule as control_char_quoting.yaml on the path that prints each Str element
# by itself: a fused jsonlines loop, which JS and jq spell separately from a Vec's printer.
# Raw control bytes reach it straight from stdin, no JSON decoding in between.
program: |
  # fmt: syntax-example
  fn shout(names: Stream<Str>) -> Stream<Str> = names | map(. + "!");


  jsonlines(shout stdin)

input: "a\bb\fc\x01d\x1fe\\b\n\bx\n"

output: |
  "a\u0008b\u000cc\u0001d\u001fe\\b!"
  "\u0008x!"

node_types: [application, builtin.jsonlines, concat, lines, local, map-over, pipe, str, var]
