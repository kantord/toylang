program: |
  # Two dimensions, so two specs: one for the groups and one for the members.
  fn names(db: {groups: Vec<{members: Vec<{name: Str}>}>}) -> Vec<Vec<Str>> =
      db.groups[].members[].name

  names(input)

input: |
  {"groups": [{"members": [{"name": "ada"}, {"name": "bo"}]}, {"members": [{"name": "cy"}]}]}

output: |
  [["ada","bo"],["cy"]]

node_types: [application, input, projection, var]
