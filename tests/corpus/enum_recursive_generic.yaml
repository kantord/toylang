# A recursive enum with a type parameter. The printers are keyed by `Type::ident`, so `Tree<Str>`
# and `Tree<Int>` would be two functions rather than one -- what makes that necessary is that the
# variant list is re-derived per instantiation, the parameter substituted, and the payload of
# `leaf` differs between them.
program: |
  enum Tree<T> { Node(Vec<Tree<T>>), Leaf(T) }

  fn label(t: Tree<Str>) -> Str = t | Node -> "node" or Leaf -> .

  {shape: Tree.node([Tree.leaf("a"), Tree.node([Tree.leaf("b")])]), top: label(Tree.leaf("x"))}

output: |
  {"shape":{"Node":[{"Leaf":"a"},{"Node":[{"Leaf":"b"}]}]},"top":"x"}

node_types: [application, local, match, pipe, record-literal, str, var, variant.payload, vec-literal]
