# join_lines is prelude.toy source now, not a per-backend builtin -- pinned on two backends of
# different shape (dynamic and statically typed) to show it compiles as an ordinary recursive
# function call in both, not through special-cased codegen.
program: |
  join_lines(["only"])

output: |
  only

snapshot: [js, go]

node_types: [application, builtin.length, builtin.tail, compare.eq, concat, int, local, match, pipe, selection.collapse, str, unwrap, var, vec-literal]
