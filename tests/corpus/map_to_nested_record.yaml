# The shape the design named as the first test of this feature: a Vec of records is one column
# per field, and `map` allocated one column, which stored record pointers where field
# values go.
program: |
  [1, 2] | map {a: {b: ., c: "z"}}

output: |
  [{"a":{"b":1,"c":"z"}},{"a":{"b":2,"c":"z"}}]

node_types: [int, local, map-over, pipe, record-literal, str, vec-literal]
