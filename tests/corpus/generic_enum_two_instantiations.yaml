# Two instantiations of one declaration in one program. This is what the emitted-name mangling
# exists for: on Go and Rust, `Box<Str>` and `Box<Int>` must become two declared types or the
# program does not compile at all, so agreement here is the witness that they do.
program: |
  enum Box<T> { Wrap(T), Empty }

  {a: wrap("x"), b: wrap(1)}

output: |
  {"a":{"Wrap":"x"},"b":{"Wrap":1}}

node_types: [int, record-literal, str, variant.payload]
