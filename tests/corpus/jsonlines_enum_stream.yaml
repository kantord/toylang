# The payoff case pairing the features shipped together (plans/streams.md step 5): NDJSON of
# mixed messages, `inputs` typed as a Stream of an enum, one exhaustive match inside map -- no
# `any()` arm, so the checker proves coverage of all three variants. The shape fuses on every
# backend; output is what the corpus can check, tests/streaming.rs is what proves fusion.
program: |
  enum Msg { Ping, Quit, Text{body: Str} }

  fn render(msgs: Stream<Msg>) -> Stream<Str> =
      msgs | map(. | Ping -> "*ping*" or Quit -> "*quit*" or Text -> .body)

  jsonlines render inputs

input: |
  "Ping"
  {"Text": {"body": "hi"}}
  "Quit"

output: |
  "*ping*"
  "hi"
  "*quit*"

node_types: [application, builtin.jsonlines, inputs, local, map-over, match, pipe, projection, str, var]
