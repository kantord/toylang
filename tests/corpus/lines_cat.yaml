# The forcing program for this cut: reading stdin incrementally, line by line, on all six
# backends, none of which pre-materializes it in Rust first. `collect` is the one place a
# stream becomes an ordinary Vec; `join_lines` and printing are unchanged from every other program.
program: |
  join_lines collect lines

input: |
  ada
  bo
  cy

output: |
  ada
  bo
  cy

node_types: [application, builtin.collect, builtin.length, builtin.tail, compare.eq, concat, int, lines, local, match, pipe, selection.collapse, str, unwrap, var]
