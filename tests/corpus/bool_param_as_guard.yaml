# A Bool parameter is a guard on its own: `b -> ..` reads as the expression `b`, exactly as
# `. -> ..` does, because a lowercase head is never a variant pattern.
program: |
  # fmt: syntax-example
  fn name(b: Bool) -> Str = b | b -> "yes" or "no";


  fn dot(b: Bool) -> Str = b | . -> "yes" or "no";


  [name true, name false, name(1 == 2), dot true, dot false]

output: |
  ["yes","no","no","yes","no"]

node_types: [application, bool, compare.eq, int, local, match, pipe, str, var, vec-literal]
