# Quoted rather than a block scalar: output
# holds bytes a block cannot reproduce.
program: |
  unlines(range 0 | map(str(.)))

output: "\n"

node_types: [application, builtin.extent, builtin.range, builtin.str, builtin.tail, compare.eq, concat, conditional, int, local, map-over, pipe, selection.collapse, str, unwrap, var]
