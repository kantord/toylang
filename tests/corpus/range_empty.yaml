# Quoted rather than a block scalar: output
# holds bytes a block cannot reproduce.
program: |
  join_lines(collect(range 0) | map(str(.)))

output: "\n"

node_types: [application, builtin.collect, builtin.length, builtin.range, builtin.str, builtin.tail, compare.eq, concat, int, local, map-over, match, pipe, selection.collapse, str, unwrap, var]
