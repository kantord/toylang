# Step five of the type-flow rework (plans/type-flow.md): both branches of a conditional
# receive the declared return type, so each variant-naming string resolves on its own.
program: |
  enum Status { Active, Inactive }

  fn status(n: Int) -> Status = "Active" if n > 0 else "Inactive"

  status(0)

output: |
  "Inactive"

node_types: [application, compare.gt, conditional, int, var, variant.unit]
