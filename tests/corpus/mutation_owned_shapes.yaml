# The shapes the in-place rule does apply to, each a fresh Vec read once by a consuming builtin or a
# `+`-concat, and the neighbours that must not: `read_after` reads `xs` again after the sort, and
# `fresh_per_call` runs twice to show a literal is a new table per call. The output is what it is
# with no optimization at all; the Lua and Rust emitters' own tests pin which of these take the
# owned form.
program: |
  enum E { A(Vec<Int>), B }


  fn read_after(n: Int) -> Vec<Int> =
    let xs = [n, 1, 2]

    sort(xs) + xs;


  fn fresh_per_call(n: Int) -> Vec<Int> =
    let xs = [n, 1]

    sort xs;


  fn append_to_built() -> Vec<Int> =
    let xs = collect(range 4)

    xs + [9];


  fn each_row_reversed() -> Vec<Vec<Int>> =
    let rows = [[3, 1, 2], [5, 4]]

    rows | map reverse(.);


  fn payload_sorted() -> Vec<Int> =
    a([3, 1, 2]) | A -> sort(.) or B -> [];


  {
    read_after: read_after 3,
    fresh_per_call: [fresh_per_call 3, fresh_per_call 0],
    append_to_built: append_to_built(),
    each_row_reversed: each_row_reversed(),
    payload_sorted: payload_sorted()
  }

output: |
  {"read_after":[1,2,3,3,1,2],"fresh_per_call":[[1,3],[0,1]],"append_to_built":[0,1,2,3,9],"each_row_reversed":[[2,1,3],[4,5]],"payload_sorted":[1,2,3]}

node_types: [application, builtin.collect, builtin.range, builtin.reverse, builtin.sort, concat, int, local, map-over, match, pipe, record-literal, var, variant.payload, vec-literal]
