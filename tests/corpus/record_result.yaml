program: |
  # `first` is a builtin now, so the record-returning function picks another name.
  fn pick(db: {u: {name: Str, age: Int}}) -> {name: Str, age: Int} = db.u

  pick(parse(stdin))

input: |
  {"u": {"name": "ada", "age": 36}}

output: |
  {"name":"ada","age":36}

node_types: [application, input, projection, var]
