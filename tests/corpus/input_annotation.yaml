# `parse(stdin)` typed by the parameter it is handed to: the checker reads the declared
# parameter type and validates stdin against it. This case dates from the retired
# `input <type>` annotation form (issue #150); the program was migrated to `parse(stdin)`
# with the stdin redesign (gh:172) and the case now pins that the signature alone is enough.
program: |
  fn f(p: { x: Int, y: Int }) -> Int = p.x * 2 + p.y * 3


  f(parse stdin)

input: |
  {"x": 3, "y": 4}

output: |
  18

node_types: [application, arith.add, arith.mul, input, int, projection, var]
