# One enum type spans two JSON shapes, and which one a value is can be unknowable until the
# program runs: `classify` returns either variant, so every backend's printer has to dispatch
# on the value's shape rather than its type alone. Also exercises the qualified spelling
# (`Shape.point`) and an enum inside a record.
program: |
  enum Shape { point, circle{r: Int} }

  fn classify(n: Int) -> Shape = n | . == 0 -> Shape.point or circle{r: n}

  {a: classify(0), b: classify(3)}

output: |
  {"a":"point","b":{"circle":{"r":3}}}

node_types: [application, compare.eq, int, local, match, pipe, record-literal, var, variant.payload, variant.unit]
