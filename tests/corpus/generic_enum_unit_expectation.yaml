# A unit variant of a generic enum says nothing about the arguments, so it can only be built
# where a position expects a known instantiation -- here the declared return type. The bare
# form is refused (tests/generics.rs); this is the spelling that works.
program: |
  enum Box<T> { Wrap(T), Empty }

  fn nothing() -> Box<Int> = empty

  nothing()

output: |
  "Empty"

node_types: [application, variant.unit]
