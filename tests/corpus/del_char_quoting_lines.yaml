# The same rule as del_char_quoting.yaml on the path that prints each Str element by itself: a
# fused jsonlines loop, with the raw 0x7f arriving straight from stdin.
program: |
  # fmt: syntax-example
  fn shout(names: Stream<Str>) -> Stream<Str> = names | map(. + "!");


  jsonlines(shout stdin)

input: "a\x7fb\n\x7f\n"

output: "\"a\x7fb!\"\n\"\x7f!\"\n"

node_types: [application, builtin.jsonlines, concat, lines, local, map-over, pipe, str, var]
