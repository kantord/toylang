# The same layout question one step earlier: the projection stops at the record rather than
# reading through it, so the result is a Vec of records that has to be spread into columns.
program: |
  fn inner(db: Vec<{a: {b: Str}, z: Int}>) -> Vec<{b: Str}> = db[].a

  inner(input)

input: |
  [{"a": {"b": "x"}, "z": 7}, {"a": {"b": "y"}, "z": 8}]

output: |
  [{"b":"x"},{"b":"y"}]
