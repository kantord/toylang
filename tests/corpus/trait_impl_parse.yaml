# A trait declaration and an impl block that target a declared, resolvable type -- `Circle`, an
# alias declared right here so this case does not depend on what the rest of the corpus happens
# to declare. Exercises the whole path real resolution now takes: dispatch, method checking, and
# codegen, not just parsing (an earlier version of this test impl'd an undeclared type and only
# passed because nothing resolved it).
program: |
  type Circle = {r: Int}

  trait Area {
      fn area(s: Self) -> Int
  }

  impl Area for Circle {
      fn area(s: Self) -> Int = s.r * s.r
  }

  {r: 3}:area()

output: |
  9

node_types: [application, arith.mul, int, projection, record-literal, var]
