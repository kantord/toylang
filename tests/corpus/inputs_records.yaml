# NDJSON in, one record per line, no wrapping [...] the way `input` alone would need. Also a
# regression guard for native's struct-of-arrays spread: tl_read_inputs assembles the packed
# record tl_parse hands back for each line into proper columns, the same invariant vec_lit and
# concat/tail already keep.
program: |
  fn names(users: Stream<{name: Str, age: Int}>) -> Stream<Str> =
      users | select(.age >= 18) | .[].name

  collect(names(inputs))

input: |
  {"name": "ada", "age": 36}
  {"name": "bo", "age": 9}
  {"name": "cy", "age": 21}

output: |
  ["ada","cy"]

node_types: [application, builtin.collect, compare.ge, inputs, int, local, map-over, pipe, projection, selection.narrow, var]
