# Goal program two of the type-flow rework (plans/type-flow.md), on a nullary function: a
# string literal checked against an enum type is the unit variant it names, the same spelling
# the wire format already gives one.
program: |
  enum Status { active, inactive }

  fn initial() -> Status = "active"

  initial()

output: |
  "active"

node_types: [application, variant.unit]
