program: |
  # Six JSON parsers and six string representations, one answer.
  fn tags(db: {rows: Vec<{name: Str, tag: Str}>}) -> Vec<{name: Str, tag: Str}> = db.rows

  tags(input)

input: |
  {"rows": [{"name": "café", "tag": "\u00e9\ud83c\udf89"}, {"name": "a\"b", "tag": "\t"}]}

output: |
  [{"name":"café","tag":"é🎉"},{"name":"a\"b","tag":"\t"}]
