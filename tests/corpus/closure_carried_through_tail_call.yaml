# Each iteration builds a predicate over its own `acc` and hands it to the next call. A backend
# that lets the closure see the variable instead of its value at build time (a tail-call loop
# reassigning its locals, say) counts against the final `acc` and prints something else.
program: |
  fn walk(
    { n, acc, pred }: { n: Int, acc: Int, pred: Int -> Bool }
  ) -> Int =
    n == 0
    | . -> ([1, 2, 3, 4, 5, 6] | select pred | length(.)) or
      walk { n: n - 1, acc: acc + 1, pred: $ > acc };


  walk { n: 3, acc: 1, pred: $ > 0 }

output: |
  3

node_types: [application, arith.add, arith.sub, builtin.length, closure, closure.apply, compare.eq, compare.gt, int, local, match, pipe, projection, record-literal, selection.narrow, var, vec-literal]
