# The nearest 16-digit decimal to each of these does not read back as the same Float, but another
# 16-digit decimal does, and JavaScript prints that one. Each is a power of two, where the rounding
# interval is narrower below the value than above it. A printer that raises the precision until
# the correctly rounded decimal reads back prints 17 digits here; the native runtime and the Lua
# backend once did.
program: |
  [
    5.225680706521042e-200,
    6.518515124270356e91,
    7.291122019556398e-304
  ]

output: |
  [5.225680706521042e-200,6.518515124270356e+91,7.291122019556398e-304]

node_types: [float, vec-literal]
