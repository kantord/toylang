# The issue's canonical single-binding `let` example: one binding whose value is a whole
# arithmetic expression, and a conditional as the block's value. The block's value is checked
# against the return type, which is what lets the `m == 0` / `m < 100` chain read the bound
# local (issue #150).
program: |
  fn classify(p: {x: Int, y: Int}) -> Str =
      let m = p.x * p.x + p.y * p.y
      "origin" if m == 0 else "near" if m < 100 else "far"

  classify(input)

input: |
  {"x": 3, "y": 4}

output: |
  near

node_types: [application, arith.add, arith.mul, compare.eq, compare.lt, conditional, input, int, local, pipe, projection, str, var]
