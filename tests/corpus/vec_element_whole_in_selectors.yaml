# A record element handed whole to a function inside select, sort_by and max_by bodies.
program: |
  fn a(r: { a: Int }) -> Int = r.a;


  fn big(r: { a: Int }) -> Bool = r.a > 1;


  {
    kept: [{ a: 1 }, { a: 2 }] | select big(.),
    sorted: [{ a: 3 }, { a: 1 }] | sort_by a(.),
    top: [{ a: 3 }, { a: 1 }] | max_by a(.)
  }

output: |
  {"kept":[{"a":2}],"sorted":[{"a":1},{"a":3}],"top":{"a":3}}

node_types: [application, compare.gt, int, local, max-by, pipe, projection, record-literal, selection.narrow, sort-by, var, vec-literal]
