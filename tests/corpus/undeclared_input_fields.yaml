program: |
  fn adults(db: {users: Vec<{name: Str, age: Int}>}) -> Vec<Str> =
      db.users | select(.age >= 18) | .[].name

  adults input

input: |
  {"users": [{"name": "ada", "age": 36, "email": "a@b.c"}], "version": 3}

output: |
  ["ada"]

node_types: [application, compare.ge, input, int, local, pipe, projection, selection.narrow, var]
