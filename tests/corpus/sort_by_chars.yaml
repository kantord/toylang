# Char has no wire form (docs/reference/types/char.md), so the order is observed through a
# comparison rather than printed directly.
program: |
  (chars "dbca" | sort_by(.))[0]! == chars("a")[0]!

output: |
  true

node_types: [builtin.chars, compare.eq, int, local, pipe, selection.collapse, sort-by, str, unwrap]
