# A character class as a range over Char, and its complement, now that the Bool keywords exist
# (kantord/toylang#96): `and` joins the two bounds and `not` is the complement. Both used to be
# spelled around the language's absence -- a conditional for the range, a comparison against a
# Bool that is one (`!= (1 == 1)`) for the complement -- which is what those keywords retired.
program: |
  fn is_digit(c: Char) -> Bool = c >= chars("0")[0]! and c <= chars("9")[0]!

  fn is_not_digit(c: Char) -> Bool = not is_digit(c)

  {
    digits: length(chars("a1b2c3") | select(is_digit(.))),
    rest: length(chars("a1b2c3") | select(is_not_digit(.)))
  }

output: |
  {"digits":3,"rest":3}

node_types: [application, builtin.chars, builtin.length, compare.ge, compare.le, int, local, logic.and, logic.not, pipe, record-literal, selection.collapse, selection.narrow, str, unwrap, var]
