# A character class as a range over Char, and its complement, both spelled with machinery the
# language already has: the conditional combines the two bounds (there is no `and`), and
# complement is a comparison against a Bool that is one (there is no `not` and no true/false
# literal, matching Bool's own doc). No new operator or syntax was added for either.
program: |
  fn is_digit(c: Char) -> Bool =
    c <= chars("9")[0]! if c >= chars("0")[0]! else 1 == 0

  fn is_not_digit(c: Char) -> Bool = is_digit(c) != (1 == 1)

  {
    digits: extent(chars("a1b2c3") | select(is_digit(.))),
    rest: extent(chars("a1b2c3") | select(is_not_digit(.)))
  }

output: |
  {"digits":3,"rest":3}

node_types: [application, builtin.chars, builtin.extent, compare.eq, compare.ge, compare.le, compare.ne, conditional, int, local, pipe, record-literal, selection.collapse, selection.narrow, str, unwrap, var]
