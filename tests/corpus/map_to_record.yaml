# A brace opening an arrow function's body is a block in JavaScript, so this is a labelled
# statement rather than an object without the parens the emitter now writes.
program: |
  [1, 2] | map {n: ., m: . + 1}

output: |
  [{"n":1,"m":2},{"n":2,"m":3}]

node_types: [arith.add, int, local, map-over, pipe, record-literal, vec-literal]
