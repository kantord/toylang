<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>toylang corpus</title>
    <script>
      // shadcn themes on a `dark` class and nothing was setting it, so a reader whose system is
      // dark got a light page. Set before first paint, so there is no flash to correct.
      ;(function () {
        var m = window.matchMedia("(prefers-color-scheme: dark)")
        var apply = function () {
          document.documentElement.classList.toggle("dark", m.matches)
        }
        apply()
        m.addEventListener("change", apply)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
