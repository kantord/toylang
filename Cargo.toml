[package]
name = "toylang"
version = "0.1.0"
edition = "2024"

[dependencies]
inkwell = { version = "0.10.0", features = ["llvm22-1"] }
mlua = { version = "0.12.0", features = ["lua54", "vendored"] }
serde_json = "1.0.151"
tempfile = "3.27.0"

[dev-dependencies]
insta = "1.48.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_norway = "0.9.42"
