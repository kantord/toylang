[package]
name = "toylang"
version = "0.1.0"
edition = "2024"
default-run = "toylang"

[workspace]
members = ["runtime-rs"]

[dependencies]
anyhow = "1.0.104"
inkwell = { version = "0.10.0", features = ["llvm22-1"] }
mlua = { version = "0.12.0", features = ["lua54", "vendored", "anyhow"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_norway = "0.9.42"
tempfile = "3.27.0"
winnow = "1.0.4"

[dev-dependencies]
insta = "1.48.0"

# build.rs reuses the parser (winnow) to check prelude.toy at build time; see build.rs itself.
[build-dependencies]
winnow = "1.0.4"

# The three lints the quality hooks forward; thresholds live in clippy.toml.
# On in the manifest so plain `cargo clippy` sees them: the Stop hook adds
# nothing of its own. See plans/quality-practices.md.
[lints.clippy]
cognitive_complexity = "warn"
too_many_lines = "warn"
fn_params_excessive_bools = "warn"

# How build.rs builds runtime-rs (a workspace member's own profile section is ignored, and a
# panic unwinding out of an `extern "C"` runtime function has nowhere to go). Not `release`,
# so the compiler's own release profile stays untouched.
[profile.runtime]
inherits = "release"
panic = "abort"
lto = true
codegen-units = 1
opt-level = 2
