[project]
name = "toylang-tools"
version = "0.1.0"
description = "Autonomous board-drive and landing tooling for the toylang repo"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "ty>=0.0.80",
]

[tool.ruff.lint]
# E501 (line length) deliberately excluded: this codebase's existing style
# uses long, detailed comment lines throughout (real incident citations,
# design rationale) and retrofitting an 88-char limit would force a huge,
# purely cosmetic reformatting pass across files with real history. SIM
# (flake8-simplify) also excluded: it false-positives heavily (18 hits,
# checked 2026-09-11) on this codebase's deliberate long-lived
# `open()`-without-`with` pattern for flock handles that must outlive a
# single block.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "C4", "PIE"]
