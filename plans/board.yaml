- id: offload-boundary-design
  title: 'Grill the offload/vectorization thesis -- kernel admissibility, batch invariance, parallel basis, tensors (draft-split). Round 2 answer (multiplicity-and-offload-round2, question vectorizability-visibility): silent/cardinality-derived vectorizability CONFIRMED (no type-level effect); the caveat''s discoverability mechanism is B now (opt-in `--explain-offload` compiler diagnostic) with C (editor/LSP hover) as a wanted future addition, not a near-term requirement. Spun off offload-explain-flag-build for B; LSP hover left unscheduled. Round 3 answer, parallel-primitive-basis (Q23): RATIFIED option A -- full basis now (map/scan/reduce/gather/scatter + segmented forms), fold and general recursion demoted to convenience leaves, future stdlib additions checked against the third-homomorphism theorem. Q22 (dense-masked-distinguishable/select representation): maintainer proposed a fourth shape (Vec-typed view, materialized only on strong reference -- ties to mutation-semantics-spike) that none of A/B/C covered; spun off select-materialization-research (gh:176) to ground a re-ask instead of re-presenting the same options. Round 4 answer, Q21 (batch-invariance-enforcement, rewritten with the mean/naive-average-of-averages worked example): RATIFIED option B -- compiler requires a declared associative combiner at every batch boundary, same enforcement posture as sort''s element-type check. Maintainer''s answer went further than the three options though, proposing the enforcement should ride on a richer effect type rather than a bare compiler gate: a distinct `Stream<Batch<T>>` (vs plain `Stream<T>`), an explicit `[Stream<T>, N] -> Stream<Batch<T, N>>` batching function, and an open question of what *initiates* batching -- explicit marker, implicit at certain constructs, or forced/unavoidable for certain operations. Spun off batch-type-design-research to ground a re-ask of that shape. Round 5 answers (wizard submission, 2026-09-07), both threads now RATIFIED: Q22 (select-materialization) -- RULED option B, the maintainer''s own proposal worked out: select keeps returning Vec; behind the name is a {source, mask-or-selection} pair, indexable via a lazily-built selection vector or mask+popcount table (O(1) per access after one O(n) build over mask bits only), compacting on the first strong reference (reusing input storage if uniquely referenced) -- the same provably-one-reference condition mutation-semantics-spike already uses. Maintainer''s follow-up, NOT yet answered: should this mask/selection-backed representation apply only to Vec, or also to streams or some other shared trait they''d both implement -- needs its own follow-up decide row before this finding gets built. Q21 follow-up (batch-type-design) -- RULED option A: opaque Batch<T> with NO operations at all (no length, indexing, equality), batch(s, n) takes n as a runtime-value hint (not a type parameter -- type-level naturals would make batch size observable/exact, defeating the unobservability round 4''s law protects), forced at the reader and at any whole-input/two-level-reduction operation, explicit everywhere else -- closes the observability hole by construction rather than a growing per-operation gate list.'
  kind: decide
  needs: [select-materialization-research, batch-type-design-research]
  soft: [benchmark-goals]
  prio: 5
  status: done

