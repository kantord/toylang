- id: module-routing-syntax-build
  issue: gh:167
  title: 'Implement `@(path)` module-as-function routing-arm syntax -- ruled (module-routing-and-erlang-target round, question module-as-function-routing-design): option C (dedicated routing-arm form) chosen; maintainer refined the spelling from the round''s bare `@path` to parenthesized `@(route-groups/baz.toy)` because it encloses the path expression. See plans/module-routing-research.md. Semantics RULED (module-routing-semantics round, wizard submission 2026-09-07), all four questions:
    (1) entry-point convention: option C, maintainer freeText leaned toward "the module''s main entry point" (functionally option A''s single fixed-name convention -- implement as a fixed name, e.g. `handle`) while flagging that a way to address a *specific* non-entry function by name is wanted eventually; that is out of scope for this build, do not block on it.
    (2) dispatch strictness: option A, full strict statically-typed call -- check_module the target file, unify the entry fn''s signature against the arm''s subject/return type exactly like any other call site, no coercion.
    (3) def visibility: option A, full merge prelude-style -- widen `Origin` from the fixed 2-variant `Copy` enum to `Origin::Module(PathBuf)` (no longer `Copy`; every `HashMap<_, (Origin, bool)>` site needs updating), and prepend the routed module''s `pub` defs to the program''s def list the way `prelude::inject` does.
    (4) enum-variant collision policy: option B, submodule enum variants are ALWAYS qualified, never bare-resolvable from the caller -- do NOT fold them into the shared `variant_owners` bare-lookup table the way (3) folds defs; this is a deliberate asymmetry between defs and enum variants, not an oversight.'
  kind: build
  needs: [file-visibility-tracking-build]
  prio: 5
  status: delegated

