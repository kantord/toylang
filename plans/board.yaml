- id: native-runtime-rs-step6-input
  title: 'Native runtime port, step 6 (plans/native-runtime-rust-research.md section 6 and section 4 rows 7 to 10): port input handling. First the small part: `tl_utf8_valid` (`core::str::from_utf8`), buffered streaming stdin lines (`BufRead::read_until(b''\\n'')`), `tl_split` (`str::split`; an empty delimiter is unreachable because the checker rejects it, and the C loop would never advance on one). Then the JSON path: replace the hand-written parser (about 625 lines: the descriptor grammar walker, `\uXXXX`, UTF-8 encoding, strings, records, enums, vecs, numbers) with `serde_json` PLUS the `float_roundtrip` feature (the research measured 14.8% of long-digit Float strings parsing wrong without it; add a test that parses such a Float so the flag cannot be dropped silently). Keep the descriptor grammar as the private protocol between src/emit_llvm.rs and the runtime, and keep the path-specific error messages (tests assert them). Before deleting the C parser, run a differential of both parsers over every corpus input and every error test and state the result in the commit. Float parsing uses `str::parse::<f64>` behind the existing JSON-number grammar check (it accepts `+1`, `1.`, `inf`, which JSON does not).'
