- id: infinite-streams-design
  title: 'Maintainer note (composed 2026-09-09, verbatim): "we need to think about the concept
    of infinite streams, as distinct types form finite streams. that would solve our issues with
    the lack of loops by gaining a counter() function that just yield i at each iteration,
    starting at zero. with that, it is possible to instantly replace while loops (just ignore the
    value) and for i loops as well (sth like takeUntil, and map); at the same time we would want
    to be sure that functions that expect a finite stream only accept a finite one; and i guess
    this may somehow be connected also the ''main loop'' and async concepts?" Needs a grilling
    round before it becomes build work: whether finite/infinite is a real type-level distinction
    (a new `Stream<T>` vs `InfiniteStream<T>`, or a marker/effect on the existing `Stream<T>`),
    what `counter()` and a `takeUntil`-shaped terminator actually look like given toylang has no
    closures/currying (functions.md: one param max), how a function''s signature states "this
    only accepts a finite stream," and whether/how this connects to the still-open main-loop and
    async questions the note itself flags as uncertain. Round answer (annotations capture,
    counter-and-takeuntil-shape.forest.yaml, counter-and-takeuntil-terminator-shape,
    2026-09-13T23:01:55Z, freeText, lightly cleaned up): maintainer pushes back on the round''s
    own background/thesis, which leans on the `.`-rebinding mechanism `select`/`map`/`max_by`
    share (a single expression evaluated per entry with `.` rebound) as what a `takeUntil`
    predicate should plug into instead of a closure. Maintainer: that mechanism already IS "a
    broken form of a lambda function/callback," and it was never meant as the permanent answer,
    just a workaround -- it needs addressing before counter/takeUntil syntax is finalized, not
    reused as-is. No option (A/B/C) picked. Spun off dot-rebinding-vs-lambda-design to ground
    the next re-ask instead of re-presenting A/B/C unchanged.'
  kind: decide
  needs: [dot-rebinding-vs-lambda-design]
  prio: 4
  status: todo

