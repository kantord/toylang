- id: dispatch-no-progress-cutoff-harness-defect
  title: '12 rows sat `status: delegated` for two days showing "in progress" while nothing
    was running -- every one had a terminal STUCK in `plans/dispatch-log.csv` hours earlier.
    Root cause per `plans/dispatch-self-healing-plan.md` (written 2026-09-14 from the raw
    dispatch artifacts): two rules in `agent_loop.py` misclassify real harness limits as task
    failures. The no-progress cutoff (`--max-turns-without-progress`, default 12) ends an
    attempt mid-exploration on any task needing more than ~15 reads before its first write,
    and discards that attempt''s transcript; the dedup rule then treats the next attempt''s
    identical "no changes, no verify run" tail as repetition and calls the run STUCK after 2
    of 3 attempts -- with zero edits made, zero signal about task scope. 46 of the last 54
    dispatch runs hit this cutoff at least once. Two rows (`tensor-transpose-build`,
    `sort-by-max-by-rust-wiring`) have real, verified, unlanded patches on disk that this same
    bug misclassified as STUCK. Decide: approve the plan''s part-1 fix (raise/disable the
    no-progress cutoff, never dedup an attempt that made edits, preflight the sandbox baseline
    to GREEN -- about an hour, one commit per step) before any further dispatch of the 12
    reset rows; separately rule on whether to land the two salvageable patches directly
    (`land_lane.py land-patch` / `agent_loop.py --resume-from`) or let them redispatch from
    scratch under the fixed harness. `docs/.grill/stuck-row-triage-2.round.yaml`''s seven
    per-row escalation questions were retired as a symptom of this same bug (more than 4 STUCK
    rows in one round is a harness signal, not 4 scope decisions) -- this row is the one real
    decision in their place.

    RULED (maintainer, 2026-09-14, in session, mail flow skipped): implement the whole plan, both
    parts. Landed the same day (commits e740140..1fda324): cutoff off by default, dedup only for
    zero-edit attempts, snapshot toylang-toolchain-v3 with tsc and a GREEN preflight, per-run
    bundles and ended_by/edits/turns, dispatch_state.py --show/--health/--capture, the tick''s
    health alarm and third verb, the two lint checks, the dev-site run page, the memory pool with
    a watch. Both salvageable patches acted on directly: sort-by-max-by-rust-wiring via
    land_lane.py land-patch, tensor-transpose-build via --resume-from/--resume-patch.'
  kind: decide
  needs: []
  status: done

