- id: shell-out-build
  issue: gh:158
  title: 'Build a streaming pipe-to-subprocess primitive for shell-out calls, e.g. lines | pipe_through("grep", [...]) | collect. Output side RULED (stream-merge-tagged-design): a fixed stdlib enum (e.g. PipeLine{ Stdout, Stderr }) tags each relayed line, `pipe_through(cmd: Str, args: Vec<Str>) -> Stream<Line>`. Input side RULED (stdin-stdout-splitting-design, wizard submission 2026-09-07): option A, symmetric Stream<Str> stdin argument -- `pipe_through(cmd: Str, args: Vec<Str>, stdin: Stream<Str>) -> Stream<Line>`. Needs a new "write a Stream out to an external sink" mechanism (nothing existing does this; jsonlines only targets toylang''s own stdout) alongside the relay-in side.'
  kind: build
  needs: [stream-merge-tagged-design]
  status: todo

- id: shell-out-stderr-relay-design
  issue: gh:158
  title: 'Q35 was RULED option A, opaque plumbing (stdout-stderr-effect-model-design, wizard submission 2026-09-07) -- a second single-instance sink alongside jsonlines, structurally unable to relay two streams (stdout and stderr) from one subprocess at once. But pipe_through''s whole point is exactly that: relay a subprocess''s stdout AND stderr in the same run. Decide how shell-out-build should actually spell this under option A before dispatching it -- e.g. two separate pipe_through-style calls each claiming one stream (never combined in one program, so a program picks stdout-relay xor stderr-relay), a merged single-stream relay that drops the distinction, or something else. Also settle the stdin/stdout splitting question flagged alongside Q35 as possibly distinct. Follow-up (wizard submission, 2026-09-07): RULED option C, merge before toylang sees them -- but the maintainer reinterpreted it away from a lossy OS-level 2>&1 merge: "it seems like all we need is a built in enum for creating combined tagged streams... so a merged stream of type A and type B is just a single stream where each item is either A or B." So pipe_through relays one Stream where each item is tagged Stdout or Stderr, not two indistinguishable byte streams. Spun off stream-merge-tagged-design to ground this against Q25''s existing Alt<A,B> sketch and produce the concrete mechanism. Stdin/stdout splitting was NOT addressed by this answer -- still open, carry it into the same follow-up.'
  kind: decide
  needs: [stdout-stderr-effect-model-design]
  status: done

- id: stream-merge-tagged-design
  issue: gh:158
  title: 'Follow-up from shell-out-stderr-relay-design''s Q35 follow-up ruling (wizard submission, 2026-09-07, option C reinterpreted): the maintainer wants pipe_through to relay stdout+stderr as one Stream whose items are tagged by origin (a built-in enum: "a merged stream of type A and type B is just a single stream where each item is either A or B"), not an OS-level 2>&1 byte merge and not two mutually-exclusive single-stream calls. Ground this against Q25''s existing Alt<A,B> sketch (already recorded for stream-ordering, plans/questions.md#q25) and the closed-nominal-enum mechanism from the enum decision -- work out whether Alt<A,B> is literally reusable here or needs its own shape, then produce the concrete pipe_through signature. Also still open: the stdin/stdout splitting question flagged since Q35 and re-flagged here, never answered by either round. RULED (wizard submission, 2026-09-07): option A, a fixed stdlib-predefined two-variant enum -- verified that an ordinary enum already produces the tagged shape with zero new type-system machinery (no Alt<A,B> needed): `enum Line { Out{text: Str}, Err{text: Str} }` over a mapped stream. pipe_through should tag with one fixed enum (e.g. PipeLine{ Stdout, Stderr }), same shape for every caller. Option B (generic over a caller-supplied enum) was not picked -- it depends on user-defined generic functions, which do not exist yet. Stdin/stdout splitting was still not addressed by this ruling -- spun off as its own row, stdin-stdout-splitting-design.'
  kind: decide
  needs: [shell-out-stderr-relay-design]
  status: done

- id: stdout-stderr-effect-model-design
  title: 'Decide Q35 (plans/questions.md#q35): what are stdout/stderr, and does a program write or return? Two commitless runs on shell-out-build (gh:158, issue-158, 2026-09-01) both spent their full budget rediscovering that pipe_through cannot be implemented until this effect model exists, then produced no code. Round 1 answer: no pick -- maintainer''s freeText pulled two directions at once ("well i would say real type, but isn''t it already the same types that we are using for our own program''s own inputs and outputs?") and flagged a second open question riding along, how stdin/stdout splitting works. Round 2 answer (wizard submission, 2026-09-07): RULED option A, opaque plumbing -- a second single-instance sink alongside jsonlines, symmetric in every rule, no sequencing form. Maintainer''s note: "not sure, but i lean towards A." This is against the research doc''s thesis (which leaned B, Sink<T> plus a sequencing form, since A structurally cannot relay two streams at once) -- so shell-out-build''s pipe_through need (relay a subprocess''s stdout AND stderr in one run) stays unresolved under A and will need its own follow-up if/when that need becomes concrete. stdin/stdout splitting for pipe_through was flagged as possibly a distinct question, not answered here -- open a follow-up decide row for it when shell-out-build is dispatched.'
  kind: decide
  needs: [stdout-stderr-effect-model-research]
  prio: 1
  status: done

- id: stdout-stderr-effect-model-research
  title: 'Landed directly (2026-09-04), not by a delegated worker: plans/stdout-stderr-effect-model-research.md. Lane had sat delegated 25 hours, 0 commits, last run burning its whole budget on read-only exploration before a blocked CLI call ended it. Core finding, verified by running real programs rather than reading docs: a toylang program is exactly one expression -- no sequencing construct exists at all -- so Q35 is not just "does stderr have a type," it is "can a program write more than once, anywhere." All three round-1 options worked through against that: A (opaque plumbing, one more single-instance sink alongside jsonlines) is real but cannot address shell-out-build''s actual need (relay a subprocess''s stdout and stderr in one run); B (extend Sink to Sink<T> plus a sequencing form, reusing `or`''s existing positional-overload precedent) is the smallest true extension and matches the maintainer''s own round-1 free text; C (a real IO<T> monad) needs a Unit type the language does not have and would leave two competing effect notations side by side. Ready for round 2.'
  kind: build
  needs: []
  prio: 4
  status: done

