- id: search-and-fold-design
  title: 'Grill the search vocabulary (choice, cut, .., ordering) and the applicative fold block -- unratified draft sections (draft-split). Round 1 leaned depth-first for `..` (Q7) but answer was "also research the performance implications before we fully commit"; round 2 needed that research before re-asking. Q7 was re-asked in the signature-matching-and-search-cut round and RULED provisional: `..` promises depth-first order (jq-compatible), flagged for reevaluation once recursive-descent-order-research lands. recursive-descent-order-research landed (2026-09-07): every real precedent surveyed (jq, XPath, JSONPath/RFC 9535) treats depth-first pre-order as load-bearing, recommending Q7 close as ratified with no reevaluation -- so Q7 drops out of this row''s remaining scope entirely, nothing left to re-ask on it. Round 4 answers (search-vocab-choice-cut-fold, no picks made): Q search-choice-point-syntax -- no pick, maintainer asks whether the choice-point operator should instead be spelled parallel to match syntax rather than a new infix operator; needs search-choice-point-match-syntax-research before re-ask. Q search-cut-semantics -- no pick, maintainer leans "first should be a real prelude function" (tentative, not ratified -- re-ask against that framing, i.e. option B reworded as an ordinary stdlib fn rather than compiler-magic sugar). Q applicative-fold-block-syntax -- no pick, maintainer questions whether fold is needed at all ("fold is basically the same as reduce... reduce is usually too low level, a code smell, results in confusing code"); before continuing fold syntax design, next round must first ask whether applicative-fold-block-syntax should be justified or dropped. RULED (wizard submission, multiplicity-choicepoint-http round, 2026-09-08): Q search-choice-point-syntax -- option A, reuse the match arm chain verbatim as a generator inside `[ ]` (`or` gains a third positional meaning: every-arm-contributes rather than first-match-wins), e.g. `[ n | . % 3 == 0 -> "fizz" or . % 5 == 0 -> "buzz" ]` on `n=15` yields `["fizz","buzz"]`. This is the one departure from the cross-language survey (no surveyed language spells branch-wider as a match-like chain), a deliberate maintainer choice for match-shape consistency over precedent. RULED (wizard submission, search-fold-select-mechanism round, 2026-09-09): Q search-cut-semantics -- option B, `first` as an ordinary prelude function (already real and verified, no new syntax). Maintainer freeText adds a real constraint not covered by option B''s plain framing: `first` must be usable on any Vec AND Stream and must return a proper `Opt` -- if a shared trait for ordered iteration exists (see `select-shared-mechanism-design`, gh:176) `first` should be built against that trait; otherwise it applies only to ordered iteration, and for unordered iteration (async messages with no fixed order, or a future set type) the maintainer explicitly says that would not be "first" but a different, more generic get-one operation, "if we even implement it" -- do not build that generic operation now, it is speculative. Q applicative-fold-block-syntax -- option B, keep designing it (the "code smell" concern noted but not disqualifying); next round on this row must present real fold-block syntax options. Both sub-questions now ruled; only applicative-fold-block-syntax''s actual syntax remains to be designed in a future round. Round 5 answer (annotations capture, applicative-fold-block-syntax-retry.forest.yaml, 2026-09-12T14:21:51Z): no option (A/B/C) picked outright -- maintainer''s freeText leans toward C''s reduce-as-primitive framing ("i guess that reduce is the generic case, and fold is like reduce, but only on things with a fixed order") but raises new surface not covered by any option: whether an operation''s result depends on iteration order (associativity) is real design work, and the maintainer flags it themselves as too complex to represent in the type system, asking what the good way to handle that is. Spun off fold-order-dependence-convention-research to survey how other languages/libraries communicate an order-dependence distinction when it is not type-checked (Haskell Foldable vs foldl'', Rust Iterator::fold''s documented left-to-right guarantee, OCaml List.fold_left vs fold_right), to ground the next re-ask instead of re-presenting A/B/C unchanged.'
  kind: decide
  needs: [search-choice-point-match-syntax-research, fold-order-dependence-convention-research]
  soft: [first-search-cut, recursive-descent-order-research]
  prio: 4
  status: todo

