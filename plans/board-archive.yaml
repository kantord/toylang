    bug misclassified as STUCK. Decide: approve the plan''s part-1 fix (raise/disable the
    no-progress cutoff, never dedup an attempt that made edits, preflight the sandbox baseline
    to GREEN -- about an hour, one commit per step) before any further dispatch of the 12
    reset rows; separately rule on whether to land the two salvageable patches directly
    (`land_lane.py land-patch` / `agent_loop.py --resume-from`) or let them redispatch from
    scratch under the fixed harness. `docs/.grill/stuck-row-triage-2.round.yaml`''s seven
    per-row escalation questions were retired as a symptom of this same bug (more than 4 STUCK
    rows in one round is a harness signal, not 4 scope decisions) -- this row is the one real
    decision in their place.

    RULED (maintainer, 2026-09-14, in session, mail flow skipped): implement the whole plan, both
