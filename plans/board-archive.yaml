- id: fmt-comments-in-ast
  title: '`toylang fmt` re-renders a file from its AST alone (maintainer ruling, 2026-09-19: one rendering per AST, the templates own the width, nothing else about the source survives), and comments are the one input the AST does not carry: `parse::skip_trivia` drops every `#` line, so `format_source` copies a leading banner back off the raw text and every other comment vanishes -- between declarations, trailing a line, inside a `let` block, and the blank line after the banner goes with it (verified 2026-09-19; benchmark-second-wave had to move all explanation into each program''s header to survive `fmt --write`). Put comments into the AST -- trivia attached by position to declarations, `let` bindings, and the file -- delete the raw-text banner path, and pin a commented multi-function program (banner, between-declaration, trailing) formatting to itself. Record the one-rendering-per-AST rule in src/emit_toylang.rs''s module doc while there. Supersedes fmt-preserve-interior-comments.'
  kind: build
  needs: []
  status: done

- id: fmt-file-template-seams
  title: '`toylang fmt`''s file template tries a node''s one-line form and breaks at the node''s own seam when it does not fit, but four positions have no seam and fall through to the overlong one-line form: a `fn` signature (record parameter types never break; Euler 11 has one at 128 columns), a match-arm body (`print_match_arm` only ever calls the compact printer, so arms break between each other but never inside; ~10 of the overlong docs lines), a `let` binding''s value (only the body after the lets wraps -- the 2026-09-19 Euler review misread this as the body not wrapping; Euler 11''s `let diagonal = ...` is 92 columns), and a postfix chain over a breakable base (`[...][n]!`, Euler 17 at 123 columns). 23 lines over 80 columns in the docs fences today, none of which the author could fix without leaving canonical form. Give each a break in `print_expr_wrapped` (and a wrapped `print_type` for signatures) and pin one case each. Supersedes fmt-wrap-body-after-let.'
  kind: build
  needs: []
  status: done
  outcome: 'Landed 47dc68a (2026-09-19). Signatures break at the parameter, then inside a record
    parameter type; a match arm breaks after its `->`; a postfix chain breaks inside its base
    with a `reserve` budget for the suffix (also fixes the trailing-operator and ` or`
    overshoots). Docs fences went from 23 lines over 80 columns to 6. The four remaining are
    the fourth seam, a `let` value: `parse.rs::def_body` holds a binding to one line, so the
    formatter cannot break one -- filed as fmt-newline-separator-grammar-decide, not fixable
    in the formatter.'

- id: fmt-one-line-template
  title: 'Maintainer ruling (2026-09-19): the formatter has exactly two templates for one AST -- the file template, which owns the 80-column width internally, and a one-line template that renders the whole program on one line with no width at all. The one-line template already exists for expressions as `print_expr_compact` (every file-template printer tries it first), but has no top: `print_def` forces a `let` block multi-line, `emit` joins declarations with blank lines, and `wrap_brace` puts trait/impl methods one per line, although the grammar accepts all three on one line (verified: a file with two `fn`s, a `let` block, and the body on one line parses and runs). Give those a one-line form and expose `toylang::fmt_one_line(src)`; pin that its output has no newline, is idempotent, and runs the same as the file form over the corpus. Comments are the one rule that differs by template: `#` runs to end of line, so the one-line template drops them (say so in the module doc). The library function is the deliverable; where it is consumed is fmt-one-line-consumer-decide.'
  kind: build
  needs: [fmt-comments-in-ast]
  status: done
  outcome: 'Landed af0007c (2026-09-19) as `toylang::fmt_one_line`, with tests/fmt_one_line.rs.
    Renders everything; refuses, by parsing its output back and comparing trees, a program the
    grammar would read differently on one line (19 of 261 corpus programs today; a module never).
    The cause is the grammar''s newline-as-separator, filed as
    fmt-newline-separator-grammar-decide; until that is ruled the template cannot be total.'

- id: fmt-newline-separator-grammar-decide
  title: 'The grammar uses a line break as the only separator in two places: between a `let`
    binding''s value and the block''s value (`parse.rs::def_body` requires the whole `let name =
    expr` on one line), and between the last definition''s body and the program body (the
    same-line rule in `takes_argument`). With bare application, `let a = x` then `a` on one line
    is the call `x(a)`, and `fn g(x: Int) -> Int = x` then `g(1)` is `x(g(1))`. Two formatter
    consequences (2026-09-19 session): a `let` value can never be broken, so Euler 11 keeps
    four lines at 83-92 columns; and `fmt_one_line` must refuse 19 of 261 corpus programs. `;`
    is lexed (`Tok::Semicolon`) and accepted nowhere. Decide: (a) accept `;` as an optional
    terminator after a `let` value and after a definition body, which the file template never
    writes and the one-line template always writes; (b) let a `let` value continue onto more
    indented lines, which fixes the file template only; (c) keep the rule and accept both
    limits. Verified probes are in the session report. Mark done when ruled.'
  kind: decide
  needs: []
  status: done
  outcome: 'Ruled 2026-09-19: keep the grammar rule. A program with a `let` block is defined as
    not one-lineable, and `toylang::fmt_one_line` refuses it outright (b5b348d); a `let` value
    stays on one line however long, so Euler 11 keeps four lines over 80 columns by design.'

