- id: trait-multi-impl-dispatch-build
  title: 'Discovered while ruling `select-shared-mechanism-design` (gh:176, 2026-09-09): the archived `trait-interface-dispatch-build` (status: done) only refactored `module_impl_defs`/`check_module` into a shared `collect_impls` helper -- it never built real multi-impl dispatch. Impl methods still lower to plain global functions keyed by method name, so `impl Trait for TypeA` and `impl Trait for TypeB` sharing a method name collide (refusal comment still present verbatim at `src/ast.rs:562-564`). Build the real dispatch: colon-call syntax (`x:foo(y)`) resolves by the receiver''s static type to the matching `impl Name for Type` block, so two impls of the same trait for different types can share a method name without collision. This is the real prerequisite `select-shared-mechanism-design` is blocked on.

    RULED (grilling round with the maintainer, then 3 rounds of adversarial skeptic review, 2026-09-09), full design at plans/trait-interface-research.md''s "Ruled during trait-multi-impl-dispatch-build grilling" section. The scope is bigger than the problem statement above implies: `check()` (the real compile path) silently drops `file.traits`/`file.impls` entirely today -- only prelude-build-time `check_module` processes any of it, and even that flattens prelude''s own impls into anonymous bare-named `Def`s, discarding which type each method was impl''d for. This build is three connected parts: (0) wire trait/impl collection into `check()` for real program files, and rework `prelude::module()`/`inject()` so prelude''s impls flow through the same mechanism as the program''s, tracking per-impl `Origin`; (1) build colon-call syntax itself (`x:foo(y)`, ruled gh:119 but never parsed -- `postfix()` has no `Tok::Colon` arm), always parenthesized, no bare-argument form, same postfix-loop precedence/chaining/same_line-guard as `.`/`!`/`[`; (2) rewrite `collect_impls`''s core logic (it currently writes impl methods straight into the flat `sigs` map, which is the actual bug) into a `(method_name, receiver_type)`-keyed table (`Vec`-scan, `Type` has no `Hash`), colliding only when two impls target the same concrete type, the same keying for `visibility`, an explicit plain-function-vs-trait-method cross-check, and a real duplicate-trait-name check (`collect_impls` today does `traits.iter().find()`, first match wins silently). Colon-call has two resolutions decided by name kind and arity (every function is unary): `x:foo()` where `foo` is a plain function is UFCS sugar for `foo(x)`; `x:foo(y)` where `foo` is a plain function is a checker error (no room for a receiver and a separate argument); either form where `foo` is a trait method name dispatches through the new table, receiver selects the impl as `Self`, `y` if present is the method''s own param. Internal `Func` names for resolved impls are `{method}::{TypeName}` (`::` unreachable inside a lexed `Ident`); backends escape to `{method}__{TypeName}` via one shared helper (today six backends each have their own independent escaper), with an explicit collision check covering both impl-vs-plain-function AND impl-vs-impl escaped names (the escaping is not injective on its own -- underscores in method/type names can make two different `(method,Type)` pairs escape identically). Must also update `tests/corpus/trait_impl_parse.yaml`, which currently impls an undeclared `Circle` and passes only because nothing resolves it today -- guaranteed red once real resolution lands. Operator overloading via traits stays explicitly deferred, not reversed: `binary`/`plus` untouched, the tentative unresolved builtin-operator-representation ruling is left exactly as ruled. Also deferred: generic functions/impls, trait type parameters, associated types; per-backend native impl bodies (`impl Foo for Bar in Python`, for language bindings) recorded as a future idea, not this cut. No reusable WIP exists -- two prior sandboxed attempts (2026-09-08) produced nothing beyond the already-landed `collect_impls` consolidation (commits `c4aa929`/`873ae4d`).'
  kind: build
  needs: []
  prio: 4
  status: done

- id: trait-generic-impls-over-type-constructors-design
  issue: gh:176
  title: 'Spun off from select-shared-mechanism-design (grilling round, 2026-09-09): the maintainer wants `impl<T> Trait for Vec<T>` to actually work, not just per-concrete-type impls -- "I think there will be stuff in the prelude that are implemented over a trait" (i.e. this is wanted beyond just unblocking select). Grounded before ruling: the checker''s existing `unify`/`substitute` pair (`src/check/mod.rs:1376`, `src/ty.rs:391`), built for generic enums, already handles `Type::Vec(Type::Param(_))` structurally -- `unify` has a `(Type::Vec(a), Type::Vec(b))` arm that recurses and binds params, `substitute` recurses through `Type::Vec`/`Type::Stream` the same way. The `<T>` param-list syntax also already exists verbatim on `EnumDecl` (`src/parse.rs:990-1005`, `enum Opt<T> { ... }`). So this is not building generics from scratch: extend `ImplDecl` with the same `params: Vec<(String, Span)>` field `EnumDecl` already has, parse `impl<T> Name for Type<T> { ... }` reusing the enum''s param-list grammar, and swap `collect_impls`''s exact-`Type`-equality dispatch for `unify` when an impl has params, substituting the binding through the method signature. RULED (same round, maintainer directed minimal bookkeeping only, no further grilling): a generic impl''s methods may use `T` only structurally -- store/pass/match a `T`-typed value (`Vec<T>`, a record field, an enum payload, an argument expecting `T`) -- never as the receiver of an operator or another dispatch, which needs bounds and stays deferred (same discipline `Self`-substitution already follows). Monomorphization is lazy and per concrete instantiation, memoized: at a dispatch site, unify the impl''s template type against the concrete receiver, substitute through the method signature, and check+synthesize a concrete `Def` the first time that combination is actually dispatched -- same shape as Rust monomorphization, and it avoids ever type-checking an abstract generic body, sidestepping the larger "generic functions with trait bounds" feature entirely.'
  kind: build
  needs: []
  prio: 4
  status: done

