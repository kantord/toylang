- id: js-build-pub-exports-build
  title: 'Ruled 2026-09-20 (forest js-build-artifact-shape): `toylang build FILE js` distinguishes library from app. LIBRARY (a file of declarations with no trailing expression): the `.js` is an ES module that exports exactly the `pub fn`s (bare `export` on those, none on the rest) and the `.d.ts` declares exactly those, so `.js` and `.d.ts` agree; any `require("fs")` the module needs becomes an `import`. APP (a trailing expression): the `.js` stays the runnable script `toylang run FILE js` uses and exports nothing, and the `.d.ts` declares no `export function` for non-`pub` functions (type aliases and enums stay). Non-`pub` functions are never exported in either case. Verified facts to start from: today the `.d.ts` declares `export function v_*` for every reachable function and the `.js` exports nothing (docs/reference/cli/build.md records the gap); node 26 runs an `export`-prefixed `.js` without package.json; `target: web` needs `type="module"` for an ES-module artifact. Not built: `.d.ts` types for an app entry point (open, see the applied line in docs/.grill/js-build-artifact-shape.forest.yaml). Update docs/reference/cli/build.md. DISPATCH 2026-09-20 (d793772a): STUCK, 2x max_turns, 0 edits (all exploration); narrowed to STEP A only (tir::Func.is_pub + pub-only `.d.ts`), library mode split to js-build-pub-exports-build-lib.'
  kind: build
  needs: []
  status: done

- id: float-builtins-build-front
  title: 'Front-end half of the float-sqrt-and-int-to-float-decide ruling (2026-09-20, option A, maintainer-edited): two plain unary builtins, `sqrt: Float -> Float` and `float: Int -> Float`. Maintainer wording: `float(x)` is just a float constructor that is also implemented for `x: Int`; `sqrt` becomes a regular builtin. `float(n)` is exact (Int is 32 bits, Float is 64). Nothing Float -> Int is ruled, so no floor/round here. `sqrt` of a negative is NaN on every backend. Follow the Sum/Max/Transpose unary-builtin wiring: `Builtin` variants in src/tir.rs, type rules in src/check/mod.rs (BUILTIN_NAMES ~line 1509; `float` also accepts a Float and returns it unchanged), src/tags.rs, build.rs arms, src/backend_support.rs LANDINGS (no backend built yet), tests/tag_coverage.rs and tests/unbuilt_arms.rs, and the ADR 0010 mention that `i64` is no longer the only conversion. No emitter arms in this row. Do NOT rewrite files with scripts. Done-gate: `just check` passes and `sqrt 2.0` / `float 1 + 0.5` type-check.'
  kind: build
  needs: [float-sqrt-and-int-to-float-decide]
  status: done

